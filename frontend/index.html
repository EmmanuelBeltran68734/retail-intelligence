<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tipografías del prototipo: Bricolage Grotesque (títulos) y Atkinson Hyperlegible (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Retail Intelligence</title>
    <!-- Aplica el tema que la persona eligió la vez pasada antes de pintar la página (evita un parpadeo) -->
    <script>
      try {
        var tema = localStorage.getItem('tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
