# Corre las pruebas del backend en GitHub cada vez que alguien sube cambios
# o abre un pull request hacia main. Si una prueba falla, el PR lo muestra en rojo.
name: Pruebas del backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/pruebas-backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/pruebas-backend.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Las pruebas usan SQLite en memoria: no necesitan PostgreSQL ni contraseñas.
      - name: Correr las pruebas
        run: pytest -q
